<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add/Edit Record — Home Tax Reminder Manager</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="text/javascript" src="/eel.js"></script>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>

    <main class="main-area">
      <header class="page-header">
        <h1 id="page-title">New Tax Record</h1>
      </header>

      <div class="page-content" style="max-width: 680px;">
        <div class="mb-20">
          <div class="fs-12 text-muted">* Required fields · Due date and penalty are set globally in Settings → Tax Cycle Configuration</div>
        </div>

        <form id="record-form">
          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label">Taxpayer Name *</label>
              <input type="text" id="name" class="form-input" placeholder="Full name in English or Marathi" required>
            </div>
            <div class="form-group">
              <label class="form-label">Property ID *</label>
              <input type="text" id="property_id" class="form-input" placeholder="GP/2024/001" required>
            </div>
            <div class="form-group">
              <label class="form-label">Ward</label>
              <input type="text" id="ward" class="form-input" placeholder="Ward 1">
            </div>
            <div class="form-group">
              <label class="form-label">Phone Number *</label>
              <input type="tel" id="phone" class="form-input" placeholder="9876543210" required maxLength="13">
            </div>
            <div class="form-group full-width">
              <label class="form-label">Address</label>
              <input type="text" id="address" class="form-input" placeholder="Plot No, Street, Village">
            </div>
            <div class="form-group">
              <label class="form-label">Base Tax Amount (₹) *</label>
              <input type="number" id="base_amount" class="form-input" placeholder="2500" min="0" step="1" required>
            </div>
            <div class="form-group">
              <label class="form-label">Payment Status</label>
              <div class="flex gap-10 mt-4">
                <button type="button" id="btn-unpaid" class="btn btn-primary btn-sm flex-1">✗ Unpaid</button>
                <button type="button" id="btn-paid" class="btn btn-secondary btn-sm flex-1">✓ Paid</button>
              </div>
            </div>
            <div class="form-group full-width" id="paid-date-group" style="display:none;">
              <label class="form-label">Payment Date</label>
              <input type="date" id="paid_date" class="form-input" style="max-width: 200px;">
              <div class="fs-11 text-muted mt-4">ⓘ Used for early payment rebate eligibility check</div>
            </div>
          </div>

          <div class="flex gap-10 mt-24">
            <button type="submit" class="btn btn-primary" id="btn-save">✓ Save Record</button>
            <a href="tax_records.html" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="js/common.js"></script>
  <script src="js/add_record.js"></script>
</body>
</html>
