<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tax Records — Home Tax Reminder Manager</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="text/javascript" src="/eel.js"></script>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>

    <main class="main-area">
      <header class="page-header">
        <h1>Tax Records</h1>
        <div class="flex gap-10">
          <a href="report.html" class="btn btn-secondary btn-sm">📊 Tax Report</a>
          <a href="add_record.html" class="btn btn-primary btn-sm">+ Add New Record</a>
        </div>
      </header>

      <div class="page-content">
        <!-- Cycle Banner -->
        <div class="cycle-banner" id="cycle-banner">Loading tax cycle...</div>

        <!-- Filter Row -->
        <div class="filter-row">
          <input type="text" id="search-input" class="form-input search-input" placeholder="🔍 Search by taxpayer name, property ID, ward, or phone...">
          <select id="status-filter" class="form-select" style="width: 140px;">
            <option value="all">All Status</option>
            <option value="unpaid">Unpaid</option>
            <option value="paid">Paid</option>
          </select>
          <select id="ward-filter" class="form-select" style="width: 140px;">
            <option value="all">All Wards</option>
          </select>
        </div>

        <!-- Records List Container -->
        <div id="records-container" class="mt-16">
          <div class="empty-state">
            <div class="spinner"></div>
            <div class="empty-sub mt-8">Loading records...</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/common.js"></script>
  <script src="js/tax_records.js"></script>
</body>
</html>
