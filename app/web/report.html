<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tax Report — Home Tax Reminder Manager</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="text/javascript" src="/eel.js"></script>
  <style>
    @media print {
      .sidebar, .page-header button, .filter-box, .no-print { display: none !important; }
      .app-shell { display: block !important; height: auto !important; }
      .main-area, .page-content { overflow: visible !important; height: auto !important; padding: 0 !important; }
      .card, .table-wrap { border: 1px solid #000 !important; box-shadow: none !important; }
      body { background: #fff !important; color: #000 !important; font-size: 11pt !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>

    <main class="main-area">
      <header class="page-header">
        <h1>Tax Report</h1>
        <div class="header-right">
          <button type="button" class="btn btn-primary btn-sm" onclick="window.print()">🖨 Print / Export PDF</button>
          <div class="header-meta" id="header-date"></div>
        </div>
      </header>

      <div class="page-content">
        <!-- Filter Card -->
        <div class="card mb-20 filter-box">
          <div class="flex-center" style="justify-content: space-between; flex-wrap: wrap; gap: 12px;">
            <div class="flex-center gap-14" style="flex-wrap: wrap;">
              <div style="display: flex; gap: 4px; background: var(--cream-2); padding: 3px; border-radius: 8px;" id="period-tabs">
                <button type="button" class="tab-btn active" data-period="yearly" style="border:none;">Yearly</button>
                <button type="button" class="tab-btn" data-period="monthly" style="border:none; background:transparent;">Monthly</button>
                <button type="button" class="tab-btn" data-period="daily" style="border:none; background:transparent;">Daily</button>
                <button type="button" class="tab-btn" data-period="all" style="border:none; background:transparent;">All Time</button>
              </div>

              <div id="period-selector-container">
                <select id="sel-year" class="form-select" style="width: 120px;">
                  <option value="2024">2024</option>
                  <option value="2025">2025</option>
                  <option value="2026" selected>2026</option>
                  <option value="2027">2027</option>
                </select>
                <input type="month" id="input-month" class="form-input" style="width: 160px; display:none;" value="2026-03">
                <input type="date" id="input-date" class="form-input" style="width: 160px; display:none;">
              </div>
            </div>

            <div class="flex-center gap-6" id="status-filter-group">
              <button type="button" class="tab-btn active" data-status="all">All</button>
              <button type="button" class="tab-btn" data-status="paid">Paid</button>
              <button type="button" class="tab-btn" data-status="unpaid">Unpaid</button>
            </div>
          </div>
        </div>

        <!-- KPI Grid -->
        <div class="stat-grid stat-grid-4 mb-24" id="report-kpi-grid">
          <div class="stat-card green">
            <div class="stat-kpi-sub text-success">Paid Tax Collected</div>
            <div class="stat-value fs-22 mt-4" style="color:#065F46;" id="rep-paid-sum">₹0</div>
            <div class="fs-11 text-success mt-2"><span id="rep-paid-count">0</span> Taxpayer(s) Paid</div>
          </div>
          <div class="stat-card red">
            <div class="stat-kpi-sub text-danger">Unpaid Outstanding</div>
            <div class="stat-value fs-22 mt-4" style="color:#991B1B;" id="rep-unpaid-sum">₹0</div>
            <div class="fs-11 text-danger mt-2"><span id="rep-unpaid-count">0</span> Taxpayer(s) Unpaid</div>
          </div>
          <div class="stat-card amber">
            <div class="stat-kpi-sub text-warn">Penalty Amount</div>
            <div class="stat-value fs-22 mt-4" style="color:#9A3412;" id="rep-penalty-sum">₹0</div>
            <div class="fs-11 text-warn mt-2">Added to late dues</div>
          </div>
          <div class="stat-card amber" style="background:#FFFBEB; border-color:#FDE68A;">
            <div class="stat-kpi-sub" style="color:#D97706;">Total Outstanding</div>
            <div class="stat-value fs-22 mt-4" style="color:#92400E;" id="rep-total-due">₹0</div>
            <div class="fs-11 text-warn mt-2">Base + penalty</div>
          </div>
        </div>

        <!-- Table Wrap -->
        <div class="table-wrap">
          <div style="padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
            <div class="fw-600 fs-13" id="table-heading">Taxpayers Statement</div>
            <div class="fs-11 text-muted" id="table-count">0 record(s)</div>
          </div>
          <table class="data-table">
            <thead>
              <tr>
                <th>Property ID</th>
                <th>Taxpayer Name</th>
                <th>Ward</th>
                <th>Status</th>
                <th class="right">Base Tax</th>
                <th class="right" id="th-rebate" style="display:none;">Rebate</th>
                <th class="right">Penalty</th>
                <th class="right">Net Amount</th>
              </tr>
            </thead>
            <tbody id="report-tbody">
              <tr><td colspan="8" class="text-muted" style="text-align:center; padding: 32px;">Loading statement...</td></tr>
            </tbody>
          </table>
        </div>

      </div>
    </main>
  </div>

  <script src="js/common.js"></script>
  <script src="js/report.js"></script>
</body>
</html>
